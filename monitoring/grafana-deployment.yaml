apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: deploy-proj-45caeda7963c
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 40
          env:
            # Don't auto-install the default bundled apps (pyroscope/exploretraces/
            # metricsdrilldown). They need internet to grafana.com (fails on the
            # minikube node's DNS) and add ~1 min to boot — which delayed Grafana
            # serving HTTP and broke the port-forward. Off = fast, clean startup.
            - name: GF_PLUGINS_PREINSTALL_DISABLED
              value: "true"
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            # Local convenience: let anyone open Grafana with full access — no
            # login screen / no forced password change (which blocked the user).
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Admin"
            - name: GF_AUTH_DISABLE_LOGIN_FORM
              value: "false"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            # Allow the dashboard to be embedded in an <iframe> inside our UI
            # (removes X-Frame-Options: deny). Combined with anonymous Admin
            # above, the dashboard renders in-app with no login.
            - name: GF_SECURITY_ALLOW_EMBEDDING
              value: "true"
          resources:
            # Small CPU request so the whole monitoring stack (prometheus +
            # grafana) fits alongside the app + kube-system on a 2-vCPU node
            # (Azure-for-Students B2s_v2 has only ~1900m allocatable, often
            # ~94% already reserved). Actual usage is tiny (~5m); the 100m
            # request used to overflow the node → prometheus stuck "Pending:
            # Insufficient cpu". Limits stay generous for bursts.
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: grafana-datasource
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: grafana-datasource
          configMap:
            name: grafana-datasource
        - name: grafana-dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: deploy-proj-45caeda7963c
  labels:
    app: grafana
spec:
  type: NodePort
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
