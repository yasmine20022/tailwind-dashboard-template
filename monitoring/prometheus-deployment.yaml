apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: deploy-proj-1101b2de4d66
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          imagePullPolicy: IfNotPresent
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 40
          resources:
            # Small CPU request so the whole monitoring stack (prometheus +
            # grafana) fits alongside the app + kube-system on a 2-vCPU node
            # (Azure-for-Students B2s_v2 has only ~1900m allocatable, often
            # ~94% already reserved). Actual usage is tiny (~5m); the 100m
            # request used to overflow the node → prometheus stuck "Pending:
            # Insufficient cpu". Limits stay generous for bursts.
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: deploy-proj-1101b2de4d66
  labels:
    app: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
